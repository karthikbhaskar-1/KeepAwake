name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KeepAwake/KeepAwake.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match <Version>$version</Version>" }
      - name: Build
        run: dotnet build KeepAwake.sln -c Release
      - name: Test
        run: dotnet test tests/KeepAwake.Tests/KeepAwake.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Size gate and checksum
        shell: pwsh
        run: |
          $exe = Get-Item src/KeepAwake/bin/Release/net48/KeepAwake.exe
          $exe | Select-Object Name, Length
          if ($exe.Length -ge 1MB) { throw "exe exceeds 1 MB" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  KeepAwake.exe" | Out-File -Encoding ascii src/KeepAwake/bin/Release/net48/KeepAwake.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAwake
          path: |
            src/KeepAwake/bin/Release/net48/KeepAwake.exe
            src/KeepAwake/bin/Release/net48/KeepAwake.exe.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/KeepAwake.Tests/TestResults/results.trx
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeepAwake
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            KeepAwake.exe
            KeepAwake.exe.sha256
          generate_release_notes: true
