name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build KeepAwake.sln -c Release
      - name: Test
        run: dotnet test tests/KeepAwake.Tests/KeepAwake.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Report size
        shell: pwsh
        run: Get-Item src/KeepAwake/bin/Release/net48/KeepAwake.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAwake
          path: src/KeepAwake/bin/Release/net48/KeepAwake.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/KeepAwake/bin/Release/net48/KeepAwake.exe
          generate_release_notes: true
